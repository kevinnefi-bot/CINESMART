      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#181827" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#spaceBg)" />
  <!-- Wormhole ring -->
  <ellipse cx="200" cy="220" rx="120" ry="40" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.8" />
