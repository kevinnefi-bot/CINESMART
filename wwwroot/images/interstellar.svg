  <circle cx="320" cy="120" r="2" fill="#ffffff" />
  <circle cx="100" cy="300" r="1" fill="#ffffff" />
  <circle cx="300" cy="280" r="1.5" fill="#ffffff" />
  <!-- Title -->
  <text x="200" y="440" font-family="'Outfit', sans-serif" font-weight="900" font-size="26" fill="#ffffff" text-anchor="middle" letter-spacing="3">INTERESTELAR</text>
  <text x="200" y="470" font-family="'Outfit', sans-serif" font-weight="600" font-size="13" fill="#f59e0b" text-anchor="middle" letter-spacing="3">EL FUTURO DE LA HUMANIDAD</text>
  <rect x="140" y="500" width="120" height="26" rx="13" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1"/>
  <text x="200" y="517" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#fef3c7" text-anchor="middle">CIENCIA FICCIÓN</text>
</svg>
