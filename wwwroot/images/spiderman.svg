<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="spiderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#spiderBg)" />
  <!-- Web pattern -->
  <path d="M 200 0 L 200 600 M 0 300 L 400 300 M 0 0 L 400 600 M 400 0 L 0 600" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <circle cx="200" cy="220" r="80" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none"/>
  <circle cx="200" cy="220" r="140" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>
  <!-- Eyes icon -->
  <polygon points="140,190 190,240 140,230" fill="#ffffff" stroke="#ef4444" stroke-width="3"/>
  <polygon points="260,190 210,240 260,230" fill="#ffffff" stroke="#ef4444" stroke-width="3"/>
  <!-- Poster Title -->
  <text x="200" y="440" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">SPIDER-MAN</text>
  <text x="200" y="470" font-family="'Outfit', sans-serif" font-weight="600" font-size="14" fill="#f87171" text-anchor="middle" letter-spacing="2">NO WAY HOME</text>
  <rect x="140" y="500" width="120" height="26" rx="13" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
  <text x="200" y="517" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#fecdd3" text-anchor="middle">ACCIÓN / MARVEL</text>
</svg>
